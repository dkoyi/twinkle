<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E262C">
<title>Call Twinkle</title>
<link rel="icon" type="image/svg+xml" href="/static/assets/favicon.svg">
<script data-assets="css">(function(){var B=location.protocol==='file:'?'./':'/static/';['phone.css'].forEach(function(f){document.write('<link rel="stylesheet" href="'+B+f+'">');});})();</script>
</head>
<body data-page="phone">
<div class="stage"><div class="shell" id="shell">
  <i class="hw hw-action"></i><i class="hw hw-up"></i><i class="hw hw-down"></i><i class="hw hw-power"></i>
  <div class="device" id="device" data-view="poster" data-voice="idle" data-spk="on" data-muted="off">

    <div class="island" aria-hidden="true"><i class="micdot"></i></div>
    <div class="statusbar" aria-hidden="true">
      <span class="sb-time" id="clock">9:41</span>
      <span class="sb-right">
        <svg viewBox="0 0 20 13" width="20" height="13"><rect x="0" y="8" width="3.4" height="5" rx="1"/><rect x="5.4" y="5.5" width="3.4" height="7.5" rx="1"/><rect x="10.8" y="3" width="3.4" height="10" rx="1"/><rect x="16.2" y="0" width="3.4" height="13" rx="1"/></svg>
        <svg viewBox="0 0 18 13" width="18" height="13"><path d="M9 11.6a1.4 1.4 0 110-2.8 1.4 1.4 0 010 2.8zM4.6 7.2a6.2 6.2 0 018.8 0l-1.3 1.4a4.3 4.3 0 00-6.2 0zM1.5 4A10.5 10.5 0 0116.5 4l-1.3 1.4a8.6 8.6 0 00-12.4 0z"/></svg>
        <svg viewBox="0 0 28 13" width="28" height="13"><rect x=".6" y=".6" width="23" height="11.8" rx="3.6" fill="none" stroke="currentColor" stroke-opacity=".5" stroke-width="1.2"/><rect x="2.2" y="2.2" width="17" height="8.6" rx="2.2"/><rect x="25" y="4.2" width="2" height="4.6" rx="1" fill-opacity=".5"/></svg>
      </span>
    </div>

    <!-- 1. contact poster: Twin / Twinkle's glasses / kle, one call button -->
    <section class="view poster" id="poster" aria-label="Twinkle">
      <div class="pt" aria-hidden="true">Twin</div>
      <img class="pm" id="posterImg" alt="Twinkle">
      <div class="pb" aria-hidden="true">kle</div>
      <button class="call-pill" id="talkBtn" data-act="talk" type="button"><span class="ico" id="talkIco" aria-hidden="true"></span><span id="talkLabel">Call Twinkle</span></button>
    </section>

    <!-- 2. the iOS call screen -->
    <section class="view call" id="call" aria-label="Call with Twinkle">
      <div class="who">
        <div class="timer" id="timer" aria-live="polite">calling&hellip;</div>
        <h1 class="name">Twinkle</h1>
      </div>
      <div class="mid"><img class="mascot" id="mascotImg" alt="" draggable="false"></div>

      <div class="grid" id="grid">
        <button class="cb" id="spkBtn" data-act="speaker" type="button" aria-pressed="true"><span class="c" id="spkIco"></span><span class="l">speaker</span></button>
        <button class="cb" id="watchBtn" data-act="watch" type="button"><span class="c" id="watchIco"></span><span class="l">FaceTime</span></button>
        <button class="cb" id="muteBtn" data-act="mute" type="button" aria-pressed="false"><span class="c" id="muteIco"></span><span class="l">mute</span></button>
        <button class="cb" id="stopBtn" data-act="stop" type="button"><span class="c" id="stopIco"></span><span class="l">stop</span></button>
        <button class="cb end" id="endBtn" data-act="end" type="button"><span class="c" id="endIco"></span><span class="l">end</span></button>
        <button class="cb" id="keyBtn" data-act="keypad" type="button"><span class="c" id="keyIco"></span><span class="l">keypad</span></button>
      </div>

      <div class="keypad" id="keypad" aria-hidden="true">
        <div class="kdisp" id="kdisp">&nbsp;</div>
        <div class="kgrid" id="kgrid"></div>
        <div class="krow"><span></span><button class="cb end" data-act="end" type="button" tabindex="-1"><span class="c" id="endIco2"></span></button><button class="khide" data-act="keypad" type="button" tabindex="-1">Hide</button></div>
      </div>
    </section>

    <div class="home" aria-hidden="true"></div>
  </div>
</div></div>

<script data-assets="js">(function(){var B=location.protocol==='file:'?'./':'/static/';['demo.js','voice.js','phone.js'].forEach(function(f){document.write('<script src="'+B+f+'"><\/script>');});})();</script>
</body>
</html>
